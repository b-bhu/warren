const companies={nvidia:{name:'NVIDIA',ticker:'NVDA',mark:'NV',about:'NVIDIA develops computing platforms for data centers, graphics and artificial intelligence.',instruments:[{id:'nvdax',product:'spot',symbol:'NVDAx',provider:'xStocks',price:222.01,change:.39,availability:'Available',volume:'$8.42m',liquidity:'$5.10m',identifier:'Xsc9qvGR1efVDFGLrVsmkzv3qi45LTBjeUKSPmx9qEh'},{id:'nvda-perp',product:'perp',symbol:'NVDA-PERP',provider:'Phoenix',price:222.18,change:.44,availability:'Available',funding:'+0.0062%',maxLeverage:5,openInterest:'48,320 NVDA'}]},openai:{name:'OpenAI',ticker:'Private company',mark:'OA',about:'OpenAI develops artificial intelligence models and products.',instruments:[{id:'openai-ps',product:'prestock',symbol:'OPENAI.PS',provider:'PreStocks',price:27.40,change:null,availability:'Available',structure:'SPV exposure',transferFee:'Unavailable'},{id:'topenai',product:'prestock',symbol:'tOpenAI',provider:'Tessera',price:28.15,change:null,availability:'Available',structure:'Loan participation',transferFee:'0.50%'}]}};
const names={spot:'Spot',perp:'Perpetuals',prestock:'PreStocks'};
const instrumentContext=item=>names[item.product]===item.provider?item.provider:`${names[item.product]} · ${item.provider}`;
const params=new URLSearchParams(location.search), companyKey=params.get('company')==='openai'?'openai':'nvidia', company=companies[companyKey];
const requestedProduct=params.get('product')==='perpetual'?'perp':params.get('product');
let selected=company.instruments.find(i=>i.id===params.get('instrument'))||company.instruments.find(i=>i.product===requestedProduct)||company.instruments[0];
const paused=params.get('state')==='paused';
const assets={USDC:{symbol:'USDC',name:'USD Coin',usd:1,decimals:6,balance:2480.50},SOL:{symbol:'SOL',name:'Solana',usd:218.40,decimals:9,balance:12.84},USDT:{symbol:'USDT',name:'Tether USD',usd:1,decimals:6,balance:830},JITOSOL:{symbol:'JitoSOL',name:'Jito Staked SOL',usd:240.10,decimals:9,balance:3.12},BONK:{symbol:'BONK',name:'Bonk',usd:.0000215,decimals:5,balance:18400000}};
let tab='overview', range='1D', phase='configure', tradeOpen=false, sheetReturn=null, tradeReturn=null, toastTimer=null, expiresAt=0;
const config={spot:{direction:'buy',amount:'100',sellAmount:'0.5',asset:'USDC'},perp:{direction:'long',amount:'100',leverage:2,order:'market',limit:'222.00'}};
const chartPaths={ '1D':[99,94,101,82,90,69,75,54,66,47,56,40,45,25,35,19,29,23], '1W':[112,89,101,70,82,79,62,43,58,37,45,25,39,17,29,14,26,23], '1M':[23,15,29,22,39,32,43,40,64,49,78,63,92,85,109,98,122,116], '3M':[125,115,119,103,109,84,96,75,83,60,72,53,61,35,47,30,37,23], '1Y':[132,123,126,108,117,91,100,79,89,59,75,54,61,33,45,23,36,23], ALL:[137,133,130,132,120,126,109,113,95,101,79,85,63,70,45,53,27,23]};
const rangeMovement={'1D':.39,'1W':2.48,'1M':-1.18,'3M':12.42,'1Y':24.08,ALL:146.75};
const ledger=rows=>`<div class="ledger">${rows.map(([label,value])=>`<div class="ledger-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div>`;
const snapshot=()=>selected.product==='spot'?[['24h token volume',selected.volume],['Token liquidity',selected.liquidity],['Network','Solana'],['Provider',selected.provider]]:selected.product==='perp'?[['Funding rate',selected.funding],['Open interest',selected.openInterest],['Maximum leverage',`${selected.maxLeverage}×`],['Margin','Isolated']]:[['Structure',selected.structure],['Provider mark',money(selected.price)],['Transfer fee',selected.transferFee],['Provider',selected.provider]];
function optionMarkup(item){return `<button class="market-option" data-instrument="${item.id}" aria-pressed="${item.id===selected.id}"><span><strong>${esc(item.symbol)}</strong><small>${esc(instrumentContext(item))}${item.structure?'<br>'+esc(item.structure):''}</small></span><span class="option-price"><strong>${money(item.price)}</strong><small>${paused?'Paused':item.availability}</small></span></button>`;}
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;},2600);}
function renderChart(){
 const isPrivate=selected.product==='prestock';$('#chart-block').hidden=isPrivate;
 if(isPrivate)return;
 const ys=chartPaths[range],path=ys.map((y,i)=>`${i?'L':'M'}${(i*360/(ys.length-1)).toFixed(1)} ${y}`).join(' ');
 $('#chart-line').setAttribute('d',path);$('#chart-area').setAttribute('d',`${path} L360 145 L0 145 Z`);
 $('#price-chart').setAttribute('aria-label',`${company.name} ${range} price history`);
 $('#range-tabs').innerHTML=Object.keys(chartPaths).map(r=>`<button data-range="${r}" aria-pressed="${r===range}">${r==='ALL'?'All':r}</button>`).join('');
 const move=range==='1D'?selected.change:rangeMovement[range];$('#price-change').textContent=`${move>=0?'+':'−'}${Math.abs(move).toFixed(2)}% · ${range==='ALL'?'All':range}`;$('#price-change').classList.toggle('negative',move<0);
}
function renderPanel(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
 if(tab==='overview'){
  $('#detail-panel').innerHTML=`${selected.product==='prestock'?'<div class="history-empty"><strong>No matching price history</strong>Each offering has its own valuation and terms.</div>':''}<div class="section-title"><h2>Snapshot</h2><span>${esc(selected.symbol)}</span></div><div class="fact-grid">${snapshot().map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="section-title"><h2>${selected.product==='prestock'?'Available offerings':'Available markets'}</h2><span>${company.instruments.length} instruments</span></div>${company.instruments.map(optionMarkup).join('')}<details class="disclosure"><summary>About ${esc(company.name)}</summary><p>${esc(company.about)}</p></details>`;
 }else if(tab==='market-data'){
  const common=[['Instrument',selected.symbol],['Product',names[selected.product]],['Provider',selected.provider],['Availability',paused?'Paused':selected.availability],['Price',money(selected.price)],['Network','Solana']];
  $('#detail-panel').innerHTML=`<div class="section-title"><h2>Instrument details</h2><span>${esc(selected.symbol)}</span></div>${ledger([...common,...snapshot().filter(([k])=>!['Provider','Network'].includes(k))])}<details class="disclosure"><summary>Exact identifier</summary><p class="identifier">${selected.identifier||'Unavailable'}</p>${selected.identifier?'<button class="text-button" data-copy-identifier>Copy identifier</button>':''}</details>`;
 }else{$('#detail-panel').innerHTML='<div class="empty-state"><h3>No company news available</h3><p class="body-copy">The latest company stories will appear here.</p></div>';}
}
function renderDetail(){
 $('#company-name').textContent=company.name;$('#company-ticker').textContent=company.ticker;$('#header-logo').innerHTML=company.mark+(icons[companyKey]||'');
 $('#selected-product').textContent=names[selected.product];
 $('#company-price').textContent=money(selected.price);$('#price-change-row').hidden=selected.product==='prestock';$('#market-status').hidden=!paused;
 $('#detail-dock-context').textContent=instrumentContext(selected);
 $('#detail-action').textContent=paused?'Market unavailable':selected.product==='prestock'?'View offering ↗':`Trade ${company.name}`;$('#detail-action').disabled=paused;
 renderChart();renderPanel();updateSaved();
}
function setInstrument(id){selected=company.instruments.find(i=>i.id===id)||selected;renderDetail();}
function updateSaved(){let saved=false;try{saved=localStorage.getItem(`warren-mock-saved-${companyKey}`)==='true';}catch{}$('#save-button').setAttribute('aria-pressed',String(saved));$('#save-button').setAttribute('aria-label',`${saved?'Unsave':'Save'} ${company.name}`);}
$('#save-button').onclick=()=>{const saved=$('#save-button').getAttribute('aria-pressed')!=='true';try{localStorage.setItem(`warren-mock-saved-${companyKey}`,String(saved));updateSaved();notify(saved?'Saved':'Removed from saved');}catch{notify('Couldn’t update saved companies. Try again.');}};
$('#share-button').onclick=async()=>{try{const url=new URL(location.href);url.searchParams.set('company',companyKey);url.searchParams.set('product',selected.product);url.searchParams.set('instrument',selected.id);await navigator.clipboard.writeText(url.href);notify('Link copied');}catch{notify('Couldn’t copy the link. Try again.');}};
function setModalState(){const active=!$('#sheet-layer').hidden?$('#sheet-layer'):tradeOpen?$('#trade-screen'):null;[$('#detail-screen'),$('#trade-screen')].forEach(el=>{el.inert=active?el!==active:el.hidden;});$('#sheet-layer').inert=$('#sheet-layer').hidden;}
function openSheet(title,content,trigger,review=false){
 sheetReturn=trigger||document.activeElement;sheetReturn?.setAttribute('aria-expanded','true');
 $('#sheet-title').textContent=title;$('#sheet-content').innerHTML=content;$('#sheet-layer').classList.toggle('is-review',review);$('#sheet-footer').hidden=!review;
 $('#sheet-close').setAttribute('aria-label',review?'Back to trade form':'Close sheet');$('#sheet-layer').hidden=false;$('#sheet-content').scrollTop=0;setModalState();$('#sheet-close').focus({preventScroll:true});
}
function closeSheet(){if($('#sheet-layer').hidden)return;$('#sheet-layer').hidden=true;phase='configure';sheetReturn?.setAttribute('aria-expanded','false');setModalState();if(sheetReturn?.isConnected)sheetReturn.focus({preventScroll:true});}
$('#sheet-close').onclick=closeSheet;$('#sheet-layer').onclick=e=>{if(e.target===$('#sheet-layer'))closeSheet();};
function chooseMarket(trigger){openSheet(selected.product==='prestock'?'Choose an offering':'Choose a market',company.instruments.map(optionMarkup).join(''),trigger);}
$('#instrument-switch').onclick=e=>chooseMarket(e.currentTarget);$('#trade-product-switch').onclick=e=>chooseMarket(e.currentTarget);
function openOffering(){openSheet('Provider offering',`<p class="eyebrow">${esc(selected.provider)} · ${esc(selected.symbol)}</p><div class="review-heading"><h2>${esc(company.name)}</h2><strong>${money(selected.price)}</strong><p>Indicative value</p></div>${ledger([['Provider',selected.provider],['Structure',selected.structure],['Transfer fee',selected.transferFee]])}<p class="helper">Access requirements, legal terms and exit conditions are set by the provider.</p>`,document.activeElement);}
function openTrade(){if(paused)return;if(selected.product==='prestock'){openOffering();return;}tradeReturn=document.activeElement;tradeOpen=true;phase='configure';$('#trade-screen').hidden=false;setModalState();renderTrade();$('#trade-back').focus({preventScroll:true});}
function closeTrade(){tradeOpen=false;$('#trade-screen').hidden=true;setModalState();renderDetail();tradeReturn?.focus({preventScroll:true});}
$('#detail-action').onclick=openTrade;
$('#trade-back').onclick=closeTrade;
function currentAmount(){const c=config[selected.product];return selected.product==='spot'&&c.direction==='sell'?c.sellAmount:c.amount;}
function amountField(label,unit,unitClickable=false,extra=''){return `<div class="amount-card ${extra}"><label class="field-label" for="trade-amount">${label}<span>${selected.product==='perp'?'Isolated margin':''}</span></label><div class="amount-entry"><input id="trade-amount" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.00" aria-describedby="amount-help trade-error" value="${esc(currentAmount())}">${unitClickable?`<button class="unit-button" data-open-assets aria-label="Choose payment asset" aria-haspopup="dialog">${unit} <span aria-hidden="true">⌄</span></button>`:`<span class="unit-label">${unit}</span>`}</div><p class="amount-foot" id="amount-help"></p></div>`;}
function actionLabel(){const direction=config[selected.product].direction;return selected.product==='spot'?(direction==='buy'?'Buy':'Sell'):`Open ${direction}`;}
function updateExposure(){const c=config.perp,value=Number(c.amount);$('#exposure-line').textContent=Number.isFinite(value)&&value>0?`${money(value*c.leverage)} position · ${c.leverage}× your collateral`:'Enter collateral to see your position size';}
function renderConfigure(){
 const c=config[selected.product],spot=selected.product==='spot',direction=c.direction,asset=assets[config.spot.asset];
 if(spot){const buying=direction==='buy',inputSymbol=buying?asset.symbol:selected.symbol,outputSymbol=buying?selected.symbol:asset.symbol;
  $('#configure').innerHTML=`<div class="segment" role="group" aria-label="Trade direction">${['buy','sell'].map(d=>`<button data-direction="${d}" aria-pressed="${d===direction}">${d==='buy'?'Buy':'Sell'}</button>`).join('')}</div>${amountField(buying?'You pay':'You sell',inputSymbol,buying)}<div class="conversion-line" aria-hidden="true"><span>↓</span></div><div class="receive-card"><p class="receive-label">You receive</p><div class="receive-line"><strong>Quote at confirmation</strong>${buying?`<span class="unit-label">${outputSymbol}</span>`:`<button class="unit-button" data-open-assets aria-label="Choose receive asset" aria-haspopup="dialog">${outputSymbol} <span aria-hidden="true">⌄</span></button>`}</div></div>`;
  $('#amount-help').textContent=`Available: ${number(buying?asset.balance:1.2408)} ${inputSymbol}`;
 }else{
  $('#configure').innerHTML=`<div class="segment" role="group" aria-label="Trade direction">${['long','short'].map(d=>`<button data-direction="${d}" aria-pressed="${d===direction}">${d==='long'?'Long':'Short'}</button>`).join('')}</div><p class="direction-help">${direction==='long'?'Long benefits when the price rises.':'Short benefits when the price falls.'}</p>${amountField('Your collateral','USDC')}<div class="parameter-row"><strong>Order type</strong><div class="order-types" role="group" aria-label="Order type">${['market','limit'].map(type=>`<button data-order="${type}" aria-pressed="${type===c.order}">${type==='market'?'Market':'Limit'}</button>`).join('')}</div></div>${c.order==='limit'?`<div class="amount-card limit-field"><label class="field-label" for="limit-price">Limit price <span>USD</span></label><div class="amount-entry"><input id="limit-price" inputmode="decimal" autocomplete="off" value="${esc(c.limit)}" placeholder="0.00"><span class="unit-label">USD</span></div><p class="amount-foot">Only fills at this price or better.</p></div>`:''}<div class="parameter-row"><strong>Leverage</strong><span class="eyebrow">${selected.maxLeverage}× maximum</span></div><div class="leverage-buttons" role="group" aria-label="Leverage">${[1,2,3,5].filter(n=>n<=selected.maxLeverage).map(n=>`<button data-leverage="${n}" aria-pressed="${n===c.leverage}">${n}×</button>`).join('')}</div><p class="exposure-line" id="exposure-line"></p><div class="risk-pending"><p>Estimated liquidation</p><strong>Shown at confirmation</strong><p class="helper">Leverage increases gains and losses. You can lose your collateral.</p></div>`;
  $('#amount-help').textContent='Available: 2,480.50 USDC';
  updateExposure();
 }
 $('#trade-action').textContent=actionLabel();$('#trade-action').disabled=false;$('#trade-error').hidden=true;
}
function renderTrade(){
 $('#trade-title').textContent=company.name;$('#trade-product-label').textContent=names[selected.product];renderConfigure();$('#trade-body').scrollTo({top:0,behavior:'instant'});
}
function openAssets(trigger){const c=config.spot;openSheet(c.direction==='buy'?'You pay with':'You receive',`<input class="sheet-search" id="asset-search" type="search" placeholder="Search assets" aria-label="Search assets"><div id="asset-options">${Object.entries(assets).map(([key,a])=>`<button class="asset-option" data-asset="${key}" data-search="${a.symbol.toLowerCase()} ${a.name.toLowerCase()}" aria-pressed="${key===c.asset}"><span class="company-logo">${esc(a.symbol.slice(0,2))}</span><span class="asset-name"><strong>${esc(a.symbol)}</strong><small>${esc(a.name)}</small></span><span><strong>${number(a.balance)}</strong><small>Available</small></span>${key===c.asset?'<span class="selected-mark" aria-hidden="true">✓</span>':''}</button>`).join('')}</div><p class="helper" id="no-assets" hidden>No assets found. Try another name or symbol.</p>`,trigger);}
const validDecimal=(text,decimals=8)=>new RegExp(`^(?:\\d+(?:\\.\\d{0,${decimals}})?|\\.\\d{1,${decimals}})$`).test(text.trim())&&Number.isFinite(Number(text))&&Number(text)>0;
function prepareReview(){
 const c=config[selected.product],amount=Number(currentAmount()),spot=selected.product==='spot',asset=assets[config.spot.asset],buying=c.direction==='buy';
 const precision=spot?(buying?asset.decimals:8):6;
 let error=!validDecimal(currentAmount(),precision)?`Enter an amount greater than zero, with up to ${precision} decimal places.`:'';
 if(!error && amount>(spot?(buying?asset.balance:1.2408):assets.USDC.balance))error='Amount exceeds your available balance.';
 if(!error && !spot && c.order==='limit'&&!validDecimal(c.limit))error='Enter a valid limit price greater than zero.';
 if(error){$('#trade-error').textContent=error;$('#trade-error').hidden=false;return;}
 phase='review';expiresAt=Date.now()+60000;
 let content='';
 if(spot){
  const inputSymbol=buying?asset.symbol:selected.symbol,outputSymbol=buying?selected.symbol:asset.symbol,output=(buying?amount*asset.usd/selected.price:amount*selected.price/asset.usd)*.998,minimum=output*.995;
  content=`<div class="review-send"><span>${buying?'You pay':'You sell'}</span><strong>${number(amount,precision)} ${inputSymbol}</strong></div><div class="review-receive"><span>You receive · estimated</span><strong>${number(output,buying?8:asset.decimals)} ${outputSymbol}</strong><small>Minimum ${number(minimum,buying?8:asset.decimals)} ${outputSymbol}</small></div>${ledger([['Price impact','0.08%'],['Platform fee',`0.20% · ${number(amount*.002,precision)} ${inputSymbol}`],['Network fee','0.00001 SOL']])}<details class="disclosure"><summary>Order details</summary>${ledger([['Instrument',selected.symbol],['Provider',selected.provider],['Route','Jupiter · Solana'],['Wallet','Warren wallet']])}</details>`;
 }else{
  const price=c.order==='limit'?Number(c.limit):selected.price,notional=amount*c.leverage,liquidation=c.leverage===1?null:price*(1+(c.direction==='long'?-1:1)*.9/c.leverage);
  content=`<div class="review-send"><span>Position size · ${c.leverage}×</span><strong>${money(notional)}</strong><small>${number(notional/price)} ${company.ticker} exposure</small></div>${ledger([['Your collateral',`${number(amount)} USDC · isolated`],['Order',c.order==='market'?'Market':`Limit · ${money(price)}`],...(c.order==='market'?[['Reference price',money(price)]]:[]),['Funding rate',selected.funding]])}<div class="risk-review"><span>Estimated liquidation price</span><strong>${liquidation===null?'Unavailable':money(liquidation)}</strong><p>Leverage increases gains and losses; you can lose your collateral.</p></div><details class="disclosure"><summary>Order details</summary>${ledger([['Instrument',selected.symbol],['Venue',selected.provider],['Trading fee','Unavailable'],['Wallet','Warren wallet']])}</details>`;
 }
 $('#trade-error').hidden=true;$('#review-status').textContent='';openSheet(`${spot?(buying?'Buy':'Sell'):(c.direction==='long'?'Long':'Short')} ${company.name}`,content,$('#trade-action'),true);updateExpiry();
}
function updateExpiry(){if(!tradeOpen||phase!=='review')return;const seconds=Math.max(0,Math.ceil((expiresAt-Date.now())/1000));$('#review-expiry').textContent=seconds?`Quote expires in ${seconds}s`:'Quote expired';$('#review-expiry').classList.toggle('expired',seconds===0);$('#review-action').textContent=seconds?`Confirm ${config[selected.product].direction}${selected.product==='perp'?' position':''}`:'Refresh quote';if(seconds===0&&!$('#review-status').textContent)$('#review-status').textContent='Quote expired. Refresh the quote to continue.';}
setInterval(updateExpiry,1000);
$('#trade-action').onclick=prepareReview;
// Developer handoff: connect this confirmation to the app wallet-signing flow.
// Do not show an order-success state until execution is confirmed by the service.
$('#review-action').onclick=()=>{if(Date.now()>=expiresAt){prepareReview();return;}closeSheet();};
$('#configure').addEventListener('input',e=>{if(e.target.id==='trade-amount'){const c=config[selected.product];if(selected.product==='spot'&&c.direction==='sell')c.sellAmount=e.target.value;else c.amount=e.target.value;$('#trade-error').hidden=true;if(selected.product==='perp')updateExposure();}if(e.target.id==='limit-price'){config.perp.limit=e.target.value;$('#trade-error').hidden=true;}});
$('#sheet-content').addEventListener('input',e=>{if(e.target.id==='asset-search'){const q=e.target.value.toLowerCase().trim();let count=0;document.querySelectorAll('[data-asset]').forEach(b=>{b.hidden=!b.dataset.search.includes(q);if(!b.hidden)count++;});$('#no-assets').hidden=count>0;}});
document.addEventListener('click',async e=>{
 const instrument=e.target.closest('[data-instrument]');if(instrument){const wasSheet=!$('#sheet-layer').hidden,changed=instrument.dataset.instrument!==selected.id;setInstrument(instrument.dataset.instrument);if(tradeOpen&&changed)renderTrade();if(wasSheet)closeSheet();else $('#instrument-switch').focus({preventScroll:true});}
 const rangeButton=e.target.closest('[data-range]');if(rangeButton){range=rangeButton.dataset.range;renderChart();$('#range-tabs').querySelector(`[data-range="${range}"]`).focus({preventScroll:true});}
 const tabButton=e.target.closest('[data-tab]');if(tabButton){tab=tabButton.dataset.tab;renderPanel();}
 const direction=e.target.closest('[data-direction]');if(direction){config[selected.product].direction=direction.dataset.direction;renderConfigure();$('#configure').querySelector(`[data-direction="${direction.dataset.direction}"]`).focus({preventScroll:true});}
 const order=e.target.closest('[data-order]');if(order){config.perp.order=order.dataset.order;renderConfigure();$('#configure').querySelector(`[data-order="${order.dataset.order}"]`).focus({preventScroll:true});}
 const leverage=e.target.closest('[data-leverage]');if(leverage){config.perp.leverage=Number(leverage.dataset.leverage);renderConfigure();$('#configure').querySelector(`[data-leverage="${leverage.dataset.leverage}"]`).focus({preventScroll:true});}
 const picker=e.target.closest('[data-open-assets]');if(picker)openAssets(picker);
 const asset=e.target.closest('[data-asset]');if(asset){const changed=config.spot.asset!==asset.dataset.asset;config.spot.asset=asset.dataset.asset;if(changed)config.spot.amount='';closeSheet();renderConfigure();$('#trade-amount').focus({preventScroll:true});}
 if(e.target.closest('[data-copy-identifier]')){try{await navigator.clipboard.writeText(selected.identifier);notify('Identifier copied');}catch{notify('Select the identifier to copy it');}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#sheet-layer').hidden){e.preventDefault();closeSheet();}else if(tradeOpen){e.preventDefault();closeTrade();}}
 const modal=!$('#sheet-layer').hidden?$('#sheet-layer'):tradeOpen?$('#trade-screen'):null;
 if(e.key==='Tab'&&modal){const focusable=[...modal.querySelectorAll('button:not(:disabled),input,a[href],summary,[tabindex="0"]')].filter(n=>!n.closest('[hidden]')&&n.getClientRects().length),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});
renderDetail();setModalState();
})();
</script>
</body>
</html>
